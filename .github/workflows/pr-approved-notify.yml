name: Notify on PR approval

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  notify:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Push notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          curl -s \
            -d "PR approved: ${{ github.event.pull_request.title }} (${{ github.event.pull_request.html_url }})" \
            "$NTFY_URL"
