name: Notify on PR merge

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Push notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          curl -s \
            -d "PR merged: ${{ github.event.pull_request.title }} (${{ github.event.pull_request.html_url }})" \
            "$NTFY_URL"
